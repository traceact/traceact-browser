name: Publish to PyPI

# Publishes the relay (the pip-installable half) to PyPI.
# Uses PyPI Trusted Publishing (OIDC); no API tokens or stored secrets.
#
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build ./relay --outdir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
