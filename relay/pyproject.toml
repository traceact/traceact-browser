[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceact-browser"
version = "1.2.0"
description = "Local relay for the traceact-browser extension: receives browser traces, writes traceact JSONL, serves snapshots and click-to-focus."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mo Shehu" }]
keywords = ["tracing", "browser", "debugging", "devtools", "traceact"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/traceact/traceact-browser"
Repository = "https://github.com/traceact/traceact-browser"
Changelog = "https://github.com/traceact/traceact-browser/blob/main/CHANGELOG.md"
Documentation = "https://github.com/traceact/traceact-browser/blob/main/USAGE.md"

[project.scripts]
traceact-browser = "traceact_browser.cli:main"

[tool.setuptools]
packages = ["traceact_browser"]

[tool.setuptools.package-data]
traceact_browser = ["py.typed", "demo.html"]
