<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; width: 320px; margin: 0; padding: 14px;
         font-size: 13px; line-height: 1.45; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .site { font-family: ui-monospace, monospace; word-break: break-all; }
  button { font: inherit; width: 100%; padding: 8px; margin-top: 8px; border-radius: 6px;
           border: 1px solid #999; cursor: pointer; background: #f5f5f5; }
  button.primary { background: #2e7d32; color: #fff; border-color: #2e7d32; }
  button.stop { background: #b71c1c; color: #fff; border-color: #b71c1c; }
  .status { margin-top: 10px; padding: 8px; border-radius: 6px; background: #f0f0f0; }
  .status.bad { background: #fdecea; }
  code { background: #e8e8e8; padding: 1px 4px; border-radius: 4px; }
  .muted { color: #555; }
  a { color: #1a56a0; }
  #copy-cmd { width: auto; padding: 2px 8px; margin-left: 6px; display: inline; }
</style>
</head>
<body>
<h1>traceact-browser</h1>
<div id="site-line" class="muted">Reading this tab…</div>
<button id="toggle" hidden></button>
<div id="relay" class="status" hidden></div>
<p class="muted" style="margin-bottom:0">
  Traces stay in one file on this computer. Nothing is sent anywhere else.
  <a id="options-link" href="#">All settings</a>
</p>
<script src="popup.js" type="module"></script>
</body>
</html>
